name: Release ZIP

# Builds the plugin ZIP with the root directory Moodle requires (`quicktranslate/`) and attaches it to a
# GitHub release. GitHub's "Download ZIP" of a branch names the root `moodle-tool_quicktranslate-main`,
# which core\update\validator rejects (rootdirinvalid); the release asset built here does not.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build the plugin ZIP with the required root directory
        run: git archive --format=zip --prefix=quicktranslate/ -o quicktranslate.zip "$GITHUB_REF_NAME"

      - name: Check the archive root
        run: |
          roots=$(unzip -Z1 quicktranslate.zip | cut -d/ -f1 | sort -u)
          echo "root directories: $roots"
          test "$roots" = "quicktranslate"

      - name: Create the release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" quicktranslate.zip --title "$GITHUB_REF_NAME" --generate-notes
